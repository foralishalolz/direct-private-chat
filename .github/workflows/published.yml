
name: Published website check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  published:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - run: npm ci --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify public release and login screen
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {chromium} from '@playwright/test';
          const url='https://bitchat-webchatter.vercel.app';
          let release;
          for(let i=0;i<8;i++){
            const response=await fetch(url+'/release.json',{redirect:'follow',signal:AbortSignal.timeout(15000)});
            if(response.ok){try{release=await response.json();}catch{}}
            if(release?.version==='2.1.0')break;
            console.log('Awaiting release',response.status);
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          assert.equal(release?.version,'2.1.0');
          const root=await fetch(url,{signal:AbortSignal.timeout(15000)});
          assert.equal(root.status,200);
          assert.equal((await fetch(url+'/manifest.webmanifest')).status,200);
          assert.equal((await fetch(url+'/sw.js')).status,200);
          console.log('PUBLIC_HTTP_PASS',url,release.version);
          const browser=await chromium.launch();
          try{
            const page=await browser.newPage({viewport:{width:390,height:844}});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.goto(url,{waitUntil:'domcontentloaded'});
            await page.getByRole('textbox',{name:'Username'}).waitFor();
            assert.ok(await page.getByRole('button',{name:'Log in',exact:true}).isVisible());
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);
            await page.getByRole('tab',{name:'Create account'}).click();
            assert.ok(await page.getByRole('button',{name:'Create account',exact:true}).isVisible());
            await page.setViewportSize({width:1440,height:900});
            assert.equal(await page.evaluate(()=>document.documentElement.scrollWidth<=innerWidth),true);
            await page.goto(url+'/login/');
            await page.getByRole('textbox',{name:'Username'}).waitFor();
            assert.deepEqual(errors,[]);
            console.log('PUBLIC_BROWSER_PASS',page.url());
            console.log('PUBLIC_SCREENSHOT '+(await page.screenshot({type:'jpeg',quality:55})).toString('base64'));
          }finally{await browser.close();}
          JS

