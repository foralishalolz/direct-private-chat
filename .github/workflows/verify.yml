
name: BitchAt checks
on:
  push:
    branches: [bitchat-production]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bitchat-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Storage and data tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Dependency security check
        run: npm audit --omit=dev --audit-level=high
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - name: Browser checks
        run: npx playwright test
      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitchat-checks
          path: |
            playwright-report/
            test-results/
          retention-days: 7
      - name: Save deployable website
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bitchat-static-release
          path: out/
          retention-days: 14
